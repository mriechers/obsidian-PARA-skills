name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # This repository is public. Without this guard, any stranger could trigger a
    # billed Claude run with write access simply by opening an issue or leaving a
    # comment. Restrict invocation to people who already have write access.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association ||
               github.event.issue.author_association ||
               github.event.review.author_association)
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    uses: mriechers/github-actions/.github/workflows/claude-interactive.yml@191a3e919bfa22c0c5cf2b85cdab4f4290651237  # v1
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
