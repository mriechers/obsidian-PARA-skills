name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]

jobs:
  review:
    # This repository is public. Fork PRs must not spend billed Claude runs or
    # reach the app's private key, so restrict reviews to branches pushed by
    # people who already have write access. To review an outside contribution,
    # check the branch out locally and open a PR from this repo.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.pull_request.author_association)
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write
      id-token: write
    uses: mriechers/github-actions/.github/workflows/claude-review.yml@191a3e919bfa22c0c5cf2b85cdab4f4290651237 # v1
    with:
      github_app_id: ${{ vars.REVIEW_APP_ID }}
      review_label: claude-review
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      github_app_private_key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
